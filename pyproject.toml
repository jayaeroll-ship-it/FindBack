[project]
name = "findback-api"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1", "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3", "email-validator>=2.2,<3",
  "argon2-cffi>=23.1,<26", "python-multipart>=0.0.20,<1",
  "Pillow>=11.1,<13", "httpx>=0.28,<1", "redis>=5.2,<7"
]
[project.optional-dependencies]
ai = ["sentence-transformers>=3.4,<6"]
test = ["pytest>=8.3,<10"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
